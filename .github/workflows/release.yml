# Package Imprint with cargo-packager and publish a GitHub Release.
#
# Flow:
#   1. Create the GitHub Release if it does not exist (author: github-actions[bot]
#      via ${{ github.token }}; do not substitute a personal PAT).
#   2. Build/pack per OS+arch: cargo-binstall + cargo-packager on native
#      macOS / Windows / Ubuntu runners. Arch jobs do not compile on Ubuntu.
#   3. Each pack job uploads binaries, then merges that platform into latest.json
#      and uploads it (.github/scripts/update-latest-json.py --upload).
#   4. Dedicated Arch jobs (`linux-arch-*`) compile and package inside
#      Arch Docker (.github/scripts/build-arch-package.sh) → .pkg.tar.zst.
#      Ubuntu runners are the Docker host only; cargo does not run on Ubuntu.
#   5. After macOS pack jobs succeed, emit a Homebrew cask from the macOS
#      .dmg files. Tag pushes commit Casks/imprint.rb to googolmo/homebrew-tap
#      (WORKFLOW_GH_TOKEN; that tap is shared, this job only touches the
#      imprint cask). imprint.rb is not a GitHub Release asset.
#   6. After Ubuntu 24.04 + Arch pack jobs succeed, tag pushes dispatch
#      googolmo/repo's `update-index` workflow with this tag (WORKFLOW_GH_TOKEN
#      as GH_TOKEN). That job rewrites APT Packages, Cloudflare _redirects
#      (.deb → this Release), and pacman/repo.conf. Ubuntu 26.04 is a separate
#      job: its failure must not skip linux-repo. Homebrew does not wait for
#      Linux; linux-repo does not wait for macOS.
#
# Triggers:
#   - push of a tag matching v* (e.g. v0.1.0) — version must match Packager.toml
#   - workflow_dispatch — packages the committed version; draft release
#
# Native runners (no cross-compile; GPUI needs host Metal / MSVC / system libs):
#   macOS   arm64   macos-latest      → .app + .dmg
#   macOS   amd64   macos-15-intel    → .app + .dmg
#   Windows amd64   windows-latest    → .msi (WiX)
#   Windows arm64   windows-11-arm    → NSIS .exe (WiX 3 is unreliable on ARM)
#   Linux   amd64   ubuntu-24.04      → .deb + AppImage (glibc 2.39)
#   Linux   arm64   ubuntu-24.04-arm  → .deb + AppImage (glibc 2.39)
#   Arch    amd64   ubuntu-24.04      → .pkg.tar.zst (Arch Docker cargo+makepkg)
#   Arch    arm64   ubuntu-24.04-arm  → .pkg.tar.zst (Arch Docker cargo+makepkg)
#   Linux   amd64   ubuntu-26.04      → .deb (glibc 2.43; runner public preview)
#   Linux   arm64   ubuntu-26.04-arm  → .deb (glibc 2.43; runner public preview)
#
# cargo-packager writes into dist/<pack_dir>/ (system, version when it
# matters, CPU). Examples: macos-arm64, ubuntu-24.04-amd64,
# windows-amd64, archlinux-arm64. tag-release-assets.py then renames
# files in that dir to
#   imprint_{version}_{system}_{cpu}{suffix}
# with cpu = amd64 | arm64. system is ubuntu24.04 / ubuntu26.04
# (.deb), linux (AppImage), macos, windows, or archlinux. GitHub Release
# assets stay flat (basename only). rustc triples stay x86_64 / aarch64.
#
# Linux/Windows arm64 hosted runners are free on public repos. Private repos
# need GitHub's arm64 larger runners (or the jobs will fail to schedule).
#
# Ubuntu 24.04 .deb is the Debian-format package for Ubuntu 24.04+ and Debian 13+
# (glibc 2.39): imprint_<ver>_ubuntu24.04_<cpu>.deb. Ubuntu 26.04 jobs upload a
# second .deb per CPU (imprint_<ver>_ubuntu26.04_<cpu>.deb) linked against that
# release's glibc; it will not run on an older distro. Ubuntu 22.04 / Debian 12
# are not packaged.
#
# ---------------------------------------------------------------------------
# Secrets / env (set on the repo; empty = skip that signing layer)
# ---------------------------------------------------------------------------
#
# GitHub (automatic)
#   GH_TOKEN / github.token
#       Create the GitHub Release and upload assets. Must stay the default
#       Actions token so the release author is github-actions[bot].
#
# Compile-time (imprint-ui/build.rs → baked into the GUI binary)
#   CARGO_PACKAGER_UPDATER_PUBKEY
#       Minisign public key from `cargo packager signer generate`.
#       Pair of CARGO_PACKAGER_SIGN_PRIVATE_KEY. Empty disables in-app updates.
#   CARGO_PACKAGER_UPDATER_ENDPOINT
#       One or more HTTPS URLs that serve latest.json (comma, semicolon, or
#       whitespace separated; later URLs are fallbacks). Defaults to
#       https://github.com/<owner>/<repo>/releases/latest/download/latest.json
#
# cargo-packager updater signatures (minisign; all platforms)
#   CARGO_PACKAGER_SIGN_PRIVATE_KEY
#       Base64 minisign secret. Also read by the CLI as `-k` /
#       env CARGO_PACKAGER_SIGN_PRIVATE_KEY. Used by
#       `cargo packager` and .github/scripts/prepare-updater-assets.py.
#   CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD
#       Password for that key. Use empty string for an unencrypted key
#       (CI must set it so cargo-packager does not prompt).
#
# macOS codesign (cargo-packager reads these while building .app/.dmg)
#   APPLE_CERTIFICATE
#       Base64 of the Developer ID Application .p12. A wrapped
#       openssl/base64 file is fine (`openssl base64 -in cert.p12`):
#         gh secret set APPLE_CERTIFICATE < cert.p12.base64
#       The pack job strips whitespace before cargo-packager.
#   APPLE_CERTIFICATE_PASSWORD
#       Password of that .p12. cargo-packager env.
#   APPLE_SIGNING_IDENTITY
#       e.g. "Developer ID Application: Name (TEAMID)".
#       cargo-packager does NOT read this env; the workflow writes it into
#       Packager.toml [macos].signing-identity before packaging.
#
# macOS notarization — App Store Connect API key only
#   (cargo-packager, only if signing-identity is set)
#   APPLE_API_KEY
#       Key ID from App Store Connect (filename AuthKey_<id>.p8)
#   APPLE_API_ISSUER
#       Issuer UUID
#   APPLE_API_KEY_CONTENT
#       Raw .p8 body. This workflow writes AuthKey_<id>.p8 and sets
#       APPLE_API_KEY_PATH for cargo-packager / notarytool.
#
# Windows Authenticode (WiX MSI / NSIS)
#   Import the PFX, locate signtool.exe (.github/scripts/locate-signtool.ps1), then
#   write Packager.toml [windows] (thumbprint + sign-command). cargo-packager's
#   built-in SignTool lookup misses ARM and some SDK 10.0.26100 layouts.
#   WINDOWS_CERTIFICATE
#       Base64 of the Authenticode .pfx / .p12
#   WINDOWS_CERTIFICATE_PASSWORD
#       PFX password
#   WINDOWS_CERTIFICATE_THUMBPRINT
#       SHA1 thumbprint if the cert is already in the store (optional;
#       computed from WINDOWS_CERTIFICATE when omitted)
#   WINDOWS_TIMESTAMP_URL
#       Timestamp server; default http://timestamp.digicert.com
#
# Linux packages are unsigned at the OS level (no extra env). Updater
# .sig files still use CARGO_PACKAGER_SIGN_PRIVATE_KEY.
#
# googolmo/homebrew-tap + googolmo/repo (other-repo writes)
#   WORKFLOW_GH_TOKEN
#       PAT that can push to googolmo/homebrew-tap and dispatch workflows on
#       googolmo/repo (fine-grained Contents + Actions: write, or classic
#       `repo` scope). Tag pushes commit Casks/imprint.rb and run
#       `gh workflow run update-index.yml`. Required on tag pushes.
#       github.token cannot write another repo, so those steps must set
#       GH_TOKEN to this secret — never the workflow GH_TOKEN. The tap hosts
#       casks for more than imprint; this workflow only updates
#       Casks/imprint.rb. googolmo/repo signs APT InRelease with its own
#       GPG_PRIVATE_KEY secret.
# ---------------------------------------------------------------------------

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release in progress: upload / latest.json merge is not safe
  # to interrupt, and a re-run of the same tag would --clobber anyway.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUST_BACKTRACE: "1"
  # Default Actions token → release created by github-actions[bot].
  GH_TOKEN: ${{ github.token }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Read Packager.toml version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Packager.toml | head -n1)"
          if [[ -z "$version" ]]; then
            echo "could not read version from Packager.toml" >&2
            exit 1
          fi
          tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "$tag" ]]; then
              echo "git tag ${GITHUB_REF_NAME} does not match Packager.toml ${tag}" >&2
              exit 1
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "releasing ${tag}"

  create-release:
    name: Create release
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release if missing
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists"
            exit 0
          fi
          extra=()
          if [[ "$DRAFT" == "true" ]]; then
            extra+=(--draft)
          fi
          # github.token / GH_TOKEN → author is github-actions[bot]
          gh release create "$TAG" \
            --title "Imprint ${VERSION}" \
            --generate-notes \
            --target "${GITHUB_SHA}" \
            "${extra[@]}"
          echo "created release ${TAG} as github-actions[bot]"

  # Pack is split by OS so downstream jobs can start as soon as their
  # platform artifacts exist. GitHub `needs` waits for every matrix cell
  # of a job; a single `package` matrix would block Homebrew on Linux
  # and linux-repo on macOS.
  package-macos:
    name: ${{ matrix.name }}
    needs: [version, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            formats: app,dmg
            arch: aarch64
            triple: aarch64-apple-darwin
            out_dir: macos-arm64
          - name: macos-amd64
            os: macos-15-intel
            formats: app,dmg
            arch: x86_64
            triple: x86_64-apple-darwin
            out_dir: macos-amd64
    uses: ./.github/workflows/release-package.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      formats: ${{ matrix.formats }}
      arch: ${{ matrix.arch }}
      triple: ${{ matrix.triple }}
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
      out_dir: ${{ matrix.out_dir }}
      deb_tag: ${{ matrix.deb_tag || '' }}
      skip_updater: ${{ matrix.skip_updater || false }}
    secrets: inherit

  package-windows:
    name: ${{ matrix.name }}
    needs: [version, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            formats: wix
            arch: x86_64
            triple: x86_64-pc-windows-msvc
            out_dir: windows-amd64
          - name: windows-arm64
            os: windows-11-arm
            formats: nsis
            arch: aarch64
            triple: aarch64-pc-windows-msvc
            out_dir: windows-arm64
    uses: ./.github/workflows/release-package.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      formats: ${{ matrix.formats }}
      arch: ${{ matrix.arch }}
      triple: ${{ matrix.triple }}
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
      out_dir: ${{ matrix.out_dir }}
      deb_tag: ${{ matrix.deb_tag || '' }}
      skip_updater: ${{ matrix.skip_updater || false }}
    secrets: inherit

  package-linux:
    name: ${{ matrix.name }}
    needs: [version, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-ubuntu24-amd64
            os: ubuntu-24.04
            formats: deb,appimage
            arch: x86_64
            triple: x86_64-unknown-linux-gnu
            out_dir: ubuntu-24.04-amd64
            deb_tag: ubuntu24.04
          - name: linux-ubuntu24-arm64
            os: ubuntu-24.04-arm
            formats: deb,appimage
            arch: aarch64
            triple: aarch64-unknown-linux-gnu
            out_dir: ubuntu-24.04-arm64
            deb_tag: ubuntu24.04
          # Ubuntu is the Docker host only; cargo build runs in Arch Linux.
          - name: linux-arch-amd64
            os: ubuntu-24.04
            formats: pacman
            arch: x86_64
            triple: x86_64-unknown-linux-gnu
            out_dir: archlinux-amd64
            skip_updater: true
          - name: linux-arch-arm64
            os: ubuntu-24.04-arm
            formats: pacman
            arch: aarch64
            triple: aarch64-unknown-linux-gnu
            out_dir: archlinux-arm64
            skip_updater: true
    uses: ./.github/workflows/release-package.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      formats: ${{ matrix.formats }}
      arch: ${{ matrix.arch }}
      triple: ${{ matrix.triple }}
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
      out_dir: ${{ matrix.out_dir }}
      deb_tag: ${{ matrix.deb_tag || '' }}
      skip_updater: ${{ matrix.skip_updater || false }}
    secrets: inherit

  # Preview runners. Must not share a matrix with package-linux: GitHub `needs`
  # waits for every cell, so a 26.04 failure would skip linux-repo.
  package-linux-preview:
    name: ${{ matrix.name }}
    needs: [version, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-ubuntu26-amd64
            os: ubuntu-26.04
            formats: deb
            arch: x86_64
            triple: x86_64-unknown-linux-gnu
            out_dir: ubuntu-26.04-amd64
            deb_tag: ubuntu26.04
            skip_updater: true
          - name: linux-ubuntu26-arm64
            os: ubuntu-26.04-arm
            formats: deb
            arch: aarch64
            triple: aarch64-unknown-linux-gnu
            out_dir: ubuntu-26.04-arm64
            deb_tag: ubuntu26.04
            skip_updater: true
    uses: ./.github/workflows/release-package.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      formats: ${{ matrix.formats }}
      arch: ${{ matrix.arch }}
      triple: ${{ matrix.triple }}
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
      out_dir: ${{ matrix.out_dir }}
      deb_tag: ${{ matrix.deb_tag || '' }}
      skip_updater: ${{ matrix.skip_updater || false }}
    secrets: inherit

  homebrew:
    name: Homebrew cask
    needs: [version, package-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS disk images
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Canonical names (tag-release-assets.py) plus cargo-packager fallbacks.
          for pattern in \
            'imprint_*_macos_arm64.dmg' \
            'imprint_*_macos_amd64.dmg' \
            'imprint_*_macos_x86_64.dmg' \
            'Imprint_*_aarch64.dmg' \
            'Imprint_*_x64.dmg'
          do
            gh release download "$TAG" --dir dist --pattern "$pattern" || true
          done

      - name: Generate Homebrew cask
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 .github/scripts/prepare-homebrew-cask.py --version "$VERSION"

      - name: Push cask to googolmo/homebrew-tap
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          WORKFLOW_GH_TOKEN: ${{ secrets.WORKFLOW_GH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${WORKFLOW_GH_TOKEN}" ]]; then
            echo "WORKFLOW_GH_TOKEN is not set; cannot push to googolmo/homebrew-tap" >&2
            exit 1
          fi
          cask="Casks/imprint.rb"
          test -f "$cask"
          tap="${RUNNER_TEMP}/homebrew-tap"
          # Public clone: keep workflow GH_TOKEN as github.token.
          gh repo clone googolmo/homebrew-tap "$tap" -- --depth 1
          mkdir -p "$tap/Casks"
          cp "$cask" "$tap/Casks/imprint.rb"
          git -C "$tap" config user.name "github-actions[bot]"
          git -C "$tap" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tap" add Casks/imprint.rb
          if git -C "$tap" diff --cached --quiet; then
            echo "cask already up to date on googolmo/homebrew-tap"
            exit 0
          fi
          git -C "$tap" commit -m "imprint ${VERSION}"
          # github.token cannot write another repo. Do not put the PAT in the
          # remote URL (git prints remotes on failure). Authenticate via header.
          branch="$(git -C "$tap" rev-parse --abbrev-ref HEAD)"
          git -C "$tap" remote set-url origin "https://github.com/googolmo/homebrew-tap.git"
          auth="$(printf 'x-access-token:%s' "$WORKFLOW_GH_TOKEN" | base64 | tr -d '\n')"
          git -C "$tap" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:${branch}"
          echo "pushed Casks/imprint.rb to googolmo/homebrew-tap"

  linux-repo:
    name: Trigger package index
    needs: [version, package-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4

      - name: Dispatch googolmo/repo update-index
        env:
          # github.token cannot dispatch another repo. Override the workflow
          # GH_TOKEN so `gh workflow run` uses the PAT.
          GH_TOKEN: ${{ secrets.WORKFLOW_GH_TOKEN }}
          WORKFLOW_GH_TOKEN: ${{ secrets.WORKFLOW_GH_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: .github/scripts/dispatch-linux-repo.sh

  # Re-dispatch after 26.04 debs exist. Skipped when preview jobs fail; that
  # must not prevent linux-repo (24.04 + Arch) from running.
  linux-repo-preview:
    name: Trigger package index (preview)
    needs: [version, package-linux, package-linux-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4

      - name: Dispatch googolmo/repo update-index
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_GH_TOKEN }}
          WORKFLOW_GH_TOKEN: ${{ secrets.WORKFLOW_GH_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: .github/scripts/dispatch-linux-repo.sh
