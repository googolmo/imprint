name = "imprint"
product-name = "Imprint"
identifier = "imprint.cdxtheme.com"
version = "0.1.0"
description = "Flash OS images onto USB drives and SD cards"
long-description = "Pick an image, pick a removable disk, write, and optionally verify. Native desktop UI plus a CLI."
homepage = "https://github.com/googolmo/imprint"
authors = ["Imprint Contributors"]
license-file = "LICENSE"
category = "Utility"
out-dir = "./dist"
binaries-dir = "./target/release"
before-packaging-command = "cargo build --release -p imprint-app -p imprint-cli"
icons = [
  "assets/icon/AppIcon.icns",
  "assets/icon/AppIcon.ico",
  "assets/icon/AppIcon.png",
]
# Updater is baked in at compile time via:
#   IMPRINT_UPDATER_PUBKEY
#   IMPRINT_UPDATER_ENDPOINT   (e.g. https://github.com/owner/repo/releases/latest/download/latest.json)
# Sign packages with `cargo packager --release -k "$CARGO_PACKAGER_SIGN_PRIVATE_KEY"`,
# then `scripts/prepare-updater-assets.sh` and upload dist/latest.json to GitHub Releases.
formats = ["app", "dmg", "wix", "deb", "appimage", "pacman"]

[[binaries]]
path = "imprint"
main = true

[[binaries]]
path = "imprint-cli"
