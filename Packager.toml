name = "imprint"
product-name = "Imprint"
identifier = "imprint.cdxtheme.com"
version = "0.1.3"
description = "Flash OS images onto USB drives and SD cards"
long-description = "Pick an image, pick a removable disk, write, and optionally verify. Native desktop UI plus a CLI."
homepage = "https://github.com/googolmo/imprint"
authors = ["Imprint Contributors"]
license-file = "LICENSE"
category = "Utility"
out-dir = "./dist"
# Native CI runners write here (`cargo build --release`). Release.yml passes
# `--target <triple>` to cargo-packager for package naming only; it does not
# change this directory. Do not cross-compile into target/<triple>/release
# without updating binaries-dir to match.
binaries-dir = "./target/release"
before-packaging-command = "cargo build --release -p imprint-app -p imprint-cli"
icons = [
  "assets/icon/AppIcon.icns",
  "assets/icon/AppIcon.ico",
  "assets/icon/AppIcon.png",
]
# Release packaging: `.github/workflows/release.yml` (native runners, both CPUs).
# Assets are renamed to imprint_{version}_{system}_{cpu}.* (cpu = x86_64|arm64):
#   macOS   arm64 / x86_64    → imprint_*_macos_{cpu}.dmg (+ .app.tar.gz updater)
#   Windows x86_64            → imprint_*_windows_x86_64.msi (WiX)
#   Windows arm64             → imprint_*_windows_arm64-setup.exe (NSIS)
#   Linux   arm64 / x86_64    → imprint_*_ubuntu22.04_{cpu}.deb
#                               + imprint_*_ubuntu22.04_{cpu}.AppImage
#                               + imprint_*_archlinux_{cpu}.pkg.tar.zst (Docker makepkg)
#   Linux   Ubuntu 24.04      → extra .deb per CPU (imprint_*_ubuntu24.04_{cpu}.deb)
#   AUR: `.github/scripts/prepare-aur-pkgbuild.py` uploads imprint-bin PKGBUILD + .SRCINFO
#        (cargo-packager's per-arch PKGBUILD is not a release asset)
#   Homebrew: `.github/scripts/prepare-homebrew-cask.py` writes Casks/imprint.rb
#             (tap: brew tap googolmo/imprint https://github.com/googolmo/imprint)
# Updater manifest: `.github/scripts/update-latest-json.py --upload <tag>` merges into the release.
# Env vars used at build/package time (full list is in that workflow's header):
#   CARGO_PACKAGER_UPDATER_PUBKEY / CARGO_PACKAGER_UPDATER_ENDPOINT (comma-separated URLs ok)
#   CARGO_PACKAGER_SIGN_PRIVATE_KEY / CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#   (CI prepends .github/scripts/codesign so imprint-cli is signed before imprint)
#   APPLE_API_KEY / APPLE_API_ISSUER / APPLE_API_KEY_CONTENT
#   WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD
#   WINDOWS_CERTIFICATE_THUMBPRINT / WINDOWS_TIMESTAMP_URL
#   (CI locates signtool.exe — cargo-packager's registry lookup is x86/x64-only)
formats = ["app", "dmg", "wix", "nsis", "deb", "appimage", "pacman"]

# Depends work on Ubuntu 22.04+ and Debian 12+ (`libasound2t64` is Ubuntu 24.04).
# Release.yml also uploads a Ubuntu 24.04-built .deb (newer glibc) per CPU.
[deb]
package-name = "imprint"
section = "utils"
depends = [
  "libxkbcommon0",
  "libxkbcommon-x11-0",
  "libwayland-client0",
  "libfontconfig1",
  "libfreetype6",
  "libx11-6",
  "libasound2 | libasound2t64",
  "libvulkan1",
  "libgl1",
]

[pacman]
depends = [
  "alsa-lib",
  "fontconfig",
  "freetype2",
  "libx11",
  "libxkbcommon",
  "libxkbcommon-x11",
  "mesa",
  "vulkan-icd-loader",
  "wayland",
]
provides = ["imprint"]
conflicts = ["imprint"]

[[binaries]]
path = "imprint"
main = true

[[binaries]]
path = "imprint-cli"
