# Package Imprint with cargo-packager and publish a GitHub Release.
#
# Flow:
#   1. Create the GitHub Release if it does not exist (author: github-actions[bot]
#      via ${{ github.token }}; do not substitute a personal PAT).
#   2. Build/pack per OS+arch on native runners with cargo-binstall + cargo-packager.
#   3. Each pack job uploads binaries, then merges that platform into latest.json
#      and uploads it (.github/scripts/update-latest-json.py --upload).
#   4. Linux pacman jobs wrap the cargo-packager usr/ tarball with makepkg
#      inside Arch Docker (.github/scripts/build-arch-package.sh) → .pkg.tar.zst.
#   5. After every pack job succeeds, emit a combined Arch Linux AUR PKGBUILD
#      (imprint-bin, x86_64 + aarch64) from the pacman tarballs.
#   6. After every pack job succeeds, emit a Homebrew cask (Casks/imprint.rb)
#      from the macOS .dmg files and upload imprint.rb. Tag pushes also commit
#      the cask to the default branch so `brew tap googolmo/imprint` stays current.
#
# Triggers:
#   - push of a tag matching v* (e.g. v0.1.0) — version must match Packager.toml
#   - workflow_dispatch — packages the committed version; draft release
#
# Native runners (no cross-compile; GPUI needs host Metal / MSVC / system libs):
#   macOS   aarch64  macos-latest      → .app + .dmg
#   macOS   x86_64   macos-15-intel    → .app + .dmg
#   Windows x86_64   windows-latest    → .msi (WiX)
#   Windows aarch64  windows-11-arm    → NSIS .exe (WiX 3 is unreliable on ARM)
#   Linux   x86_64   ubuntu-22.04      → .deb + AppImage + Arch .pkg.tar.zst (Docker makepkg)
#   Linux   aarch64  ubuntu-22.04-arm  → .deb + AppImage + Arch .pkg.tar.zst (Docker makepkg)
#   Linux   x86_64   ubuntu-24.04      → .deb (glibc 2.39)
#   Linux   aarch64  ubuntu-24.04-arm  → .deb (glibc 2.39)
#
# Every uploaded binary is renamed by .github/scripts/tag-release-assets.py to
#   imprint_{version}_{system}_{cpu}{suffix}
# with cpu = x86_64 | arm64. system is ubuntu22.04 / ubuntu24.04 (.deb and
# AppImage), macos, windows, or archlinux.
#
# Linux/Windows arm64 hosted runners are free on public repos. Private repos
# need GitHub's arm64 larger runners (or the jobs will fail to schedule).
#
# Ubuntu 22.04 .deb is the Debian-format package for Ubuntu 22.04+ and Debian 12+
# (glibc 2.35): imprint_<ver>_ubuntu22.04_<cpu>.deb. Ubuntu 24.04 jobs upload a
# second .deb per CPU named imprint_<ver>_ubuntu24.04_<cpu>.deb (newer glibc;
# will not run on 22.04 / bookworm).
#
# ---------------------------------------------------------------------------
# Secrets / env (set on the repo; empty = skip that signing layer)
# ---------------------------------------------------------------------------
#
# GitHub (automatic)
#   GH_TOKEN / github.token
#       Create the GitHub Release and upload assets. Must stay the default
#       Actions token so the release author is github-actions[bot].
#
# Compile-time (imprint-ui/build.rs → baked into the GUI binary)
#   CARGO_PACKAGER_UPDATER_PUBKEY
#       Minisign public key from `cargo packager signer generate`.
#       Pair of CARGO_PACKAGER_SIGN_PRIVATE_KEY. Empty disables in-app updates.
#   CARGO_PACKAGER_UPDATER_ENDPOINT
#       One or more HTTPS URLs that serve latest.json (comma, semicolon, or
#       whitespace separated; later URLs are fallbacks). Defaults to
#       https://github.com/<owner>/<repo>/releases/latest/download/latest.json
#
# cargo-packager updater signatures (minisign; all platforms)
#   CARGO_PACKAGER_SIGN_PRIVATE_KEY
#       Base64 minisign secret. Also read by the CLI as `-k` /
#       env CARGO_PACKAGER_SIGN_PRIVATE_KEY. Used by
#       `cargo packager` and .github/scripts/prepare-updater-assets.py.
#   CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD
#       Password for that key. Use empty string for an unencrypted key
#       (CI must set it so cargo-packager does not prompt).
#
# macOS codesign (cargo-packager reads these while building .app/.dmg)
#   APPLE_CERTIFICATE
#       Base64 of the Developer ID Application .p12. A wrapped
#       openssl/base64 file is fine (`openssl base64 -in cert.p12`):
#         gh secret set APPLE_CERTIFICATE < cert.p12.base64
#       The pack job strips whitespace before cargo-packager.
#   APPLE_CERTIFICATE_PASSWORD
#       Password of that .p12. cargo-packager env.
#   APPLE_SIGNING_IDENTITY
#       e.g. "Developer ID Application: Name (TEAMID)".
#       cargo-packager does NOT read this env; the workflow writes it into
#       Packager.toml [macos].signing-identity before packaging.
#
# macOS notarization — App Store Connect API key only
#   (cargo-packager, only if signing-identity is set)
#   APPLE_API_KEY
#       Key ID from App Store Connect (filename AuthKey_<id>.p8)
#   APPLE_API_ISSUER
#       Issuer UUID
#   APPLE_API_KEY_CONTENT
#       Raw .p8 body. This workflow writes AuthKey_<id>.p8 and sets
#       APPLE_API_KEY_PATH for cargo-packager / notarytool.
#
# Windows Authenticode (WiX MSI / NSIS)
#   Import the PFX, locate signtool.exe (.github/scripts/locate-signtool.ps1), then
#   write Packager.toml [windows] (thumbprint + sign-command). cargo-packager's
#   built-in SignTool lookup misses ARM and some SDK 10.0.26100 layouts.
#   WINDOWS_CERTIFICATE
#       Base64 of the Authenticode .pfx / .p12
#   WINDOWS_CERTIFICATE_PASSWORD
#       PFX password
#   WINDOWS_CERTIFICATE_THUMBPRINT
#       SHA1 thumbprint if the cert is already in the store (optional;
#       computed from WINDOWS_CERTIFICATE when omitted)
#   WINDOWS_TIMESTAMP_URL
#       Timestamp server; default http://timestamp.digicert.com
#
# Linux packages are unsigned at the OS level (no extra env). Updater
# .sig files still use CARGO_PACKAGER_SIGN_PRIVATE_KEY.
# ---------------------------------------------------------------------------

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUST_BACKTRACE: "1"
  # Default Actions token → release created by github-actions[bot].
  GH_TOKEN: ${{ github.token }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Read Packager.toml version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Packager.toml | head -n1)"
          if [[ -z "$version" ]]; then
            echo "could not read version from Packager.toml" >&2
            exit 1
          fi
          tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "$tag" ]]; then
              echo "git tag ${GITHUB_REF_NAME} does not match Packager.toml ${tag}" >&2
              exit 1
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "releasing ${tag}"

  create-release:
    name: Create release
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release if missing
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists"
            exit 0
          fi
          extra=()
          if [[ "$DRAFT" == "true" ]]; then
            extra+=(--draft)
          fi
          # github.token / GH_TOKEN → author is github-actions[bot]
          gh release create "$TAG" \
            --title "Imprint ${VERSION}" \
            --generate-notes \
            --target "${GITHUB_SHA}" \
            "${extra[@]}"
          echo "created release ${TAG} as github-actions[bot]"

  package:
    name: ${{ matrix.name }}
    needs: [version, create-release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-latest
            formats: app,dmg
            arch: aarch64
            triple: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-15-intel
            formats: app,dmg
            arch: x86_64
            triple: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            formats: wix
            arch: x86_64
            triple: x86_64-pc-windows-msvc
          - name: windows-aarch64
            os: windows-11-arm
            formats: nsis
            arch: aarch64
            triple: aarch64-pc-windows-msvc
          - name: linux-x86_64
            os: ubuntu-22.04
            formats: deb,appimage,pacman
            arch: x86_64
            triple: x86_64-unknown-linux-gnu
            deb_tag: ubuntu22.04
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            formats: deb,appimage,pacman
            arch: aarch64
            triple: aarch64-unknown-linux-gnu
            deb_tag: ubuntu22.04
          - name: linux-ubuntu24-x86_64
            os: ubuntu-24.04
            formats: deb
            arch: x86_64
            triple: x86_64-unknown-linux-gnu
            deb_tag: ubuntu24.04
            skip_updater: true
          - name: linux-ubuntu24-aarch64
            os: ubuntu-24.04-arm
            formats: deb
            arch: aarch64
            triple: aarch64-unknown-linux-gnu
            deb_tag: ubuntu24.04
            skip_updater: true
    env:
      # Compile-time updater config (imprint-ui/build.rs)
      CARGO_PACKAGER_UPDATER_PUBKEY: ${{ secrets.CARGO_PACKAGER_UPDATER_PUBKEY }}
      CARGO_PACKAGER_UPDATER_ENDPOINT: ${{ secrets.CARGO_PACKAGER_UPDATER_ENDPOINT }}
      # cargo-packager minisign
      CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
      CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
      # macOS codesign + notarization
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      # Windows Authenticode
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
      WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
      # linuxdeploy AppImages need this when FUSE is unavailable (ARM runners).
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.22.0

      - name: Install cargo-packager
        shell: bash
        run: |
          set -euo pipefail
          # cargo-binstall may not ship an ARM Windows / ARM Linux binary yet.
          if ! cargo binstall --no-confirm --locked cargo-packager; then
            echo "cargo-binstall failed; compiling cargo-packager from crates.io"
            cargo install --locked cargo-packager
          fi

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        env:
          FORMATS: ${{ matrix.formats }}
        run: |
          sudo apt-get update
          pkgs=(
            build-essential
            clang
            cmake
            pkg-config
            libssl-dev
            libzstd-dev
            libclang-dev
            libfontconfig-dev
            libfreetype6-dev
            libxkbcommon-dev
            libxkbcommon-x11-dev
            libwayland-dev
            libx11-dev
            libxrandr-dev
            libxi-dev
            libxinerama-dev
            libxcursor-dev
            libxcomposite-dev
            libxdamage-dev
            libxext-dev
            libxfixes-dev
            libasound2-dev
            libvulkan-dev
            libgl1-mesa-dev
            mesa-vulkan-drivers
          )
          # fuse / linuxdeploy are AppImage-only; Ubuntu 24.04 dropped libfuse2.
          if [[ "$FORMATS" == *appimage* ]]; then
            pkgs+=(file wget fuse libfuse2 patchelf desktop-file-utils)
          fi
          sudo apt-get install -y --no-install-recommends "${pkgs[@]}"

      - name: Select Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Default updater endpoint
        shell: bash
        run: |
          if [[ -z "${CARGO_PACKAGER_UPDATER_ENDPOINT:-}" ]]; then
            endpoint="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"
            echo "CARGO_PACKAGER_UPDATER_ENDPOINT=${endpoint}" >> "$GITHUB_ENV"
            echo "CARGO_PACKAGER_UPDATER_ENDPOINT unset; using ${endpoint}"
          fi

      - name: Write App Store Connect API key
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_API_KEY_CONTENT:-}" || -z "${APPLE_API_KEY:-}" ]]; then
            echo "APPLE_API_KEY_CONTENT / APPLE_API_KEY not set; skipping .p8 write"
            exit 0
          fi
          mkdir -p private_keys "${HOME}/private_keys" "${HOME}/.appstoreconnect/private_keys"
          keyfile="private_keys/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "${APPLE_API_KEY_CONTENT}" > "${keyfile}"
          chmod 600 "${keyfile}"
          echo "APPLE_API_KEY_PATH=${PWD}/${keyfile}" >> "$GITHUB_ENV"

      - name: Normalize APPLE_CERTIFICATE
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then
            echo "APPLE_CERTIFICATE unset; .app/.dmg will not be Developer ID signed"
            exit 0
          fi
          # Secret may be an openssl-wrapped .p12.base64 file (newlines).
          # Collapse to one line so GitHub env + cargo-packager decode it.
          normalized="$(printf '%s' "$APPLE_CERTIFICATE" | tr -d '[:space:]')"
          if [[ -z "$normalized" ]]; then
            echo "APPLE_CERTIFICATE empty after stripping whitespace" >&2
            exit 1
          fi
          {
            echo "APPLE_CERTIFICATE<<APPLE_CERTIFICATE_EOF"
            printf '%s\n' "$normalized"
            echo "APPLE_CERTIFICATE_EOF"
          } >> "$GITHUB_ENV"

      - name: Inject macOS signing identity
        if: runner.os == 'macOS'
        shell: bash
        run: python3 .github/scripts/inject-packager-signing.py

      # cargo-packager signs MacOS/* by path depth only; imprint-cli is a
      # sibling of the main exe and must be signed first. Prepend a codesign
      # wrapper that does that (.github/scripts/codesign).
      - name: Wrap codesign for nested MacOS binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          wrap="${RUNNER_TEMP}/imprint-codesign"
          mkdir -p "$wrap"
          cp .github/scripts/codesign "$wrap/codesign"
          chmod +x "$wrap/codesign"
          echo "$wrap" >> "$GITHUB_PATH"

      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $thumb = $env:WINDOWS_CERTIFICATE_THUMBPRINT
          if (-not $thumb -and $env:WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP "windows-cert.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $pass = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pass
            $thumb = $cert.Thumbprint
            Remove-Item $pfx -Force
          }
          if (-not $thumb) {
            Write-Host "no WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_THUMBPRINT; MSI will be unsigned"
            exit 0
          }
          echo "WINDOWS_CERTIFICATE_THUMBPRINT=$thumb" >> $env:GITHUB_ENV

      - name: Locate SignTool
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/locate-signtool.ps1

      - name: Inject Windows Authenticode config
        if: runner.os == 'Windows'
        shell: bash
        run: python3 .github/scripts/inject-packager-signing.py

      - name: cargo packager
        shell: bash
        run: |
          set -euo pipefail
          # GitHub maps missing secrets to ""; cargo-packager treats Some("") as set.
          for var in \
            CARGO_PACKAGER_SIGN_PRIVATE_KEY \
            CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            WINDOWS_CERTIFICATE \
            WINDOWS_CERTIFICATE_PASSWORD \
            WINDOWS_CERTIFICATE_THUMBPRINT \
            WINDOWS_TIMESTAMP_URL
          do
            if [[ -z "${!var:-}" ]]; then
              unset "$var" || true
            fi
          done
          # Force App Store Connect API key notarization; ignore Apple ID / keychain.
          unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_KEYCHAIN_PROFILE || true

          extra=()
          if [[ -n "${CARGO_PACKAGER_SIGN_PRIVATE_KEY:-}" ]]; then
            extra+=(-k "${CARGO_PACKAGER_SIGN_PRIVATE_KEY}" --password "${CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD:-}")
          else
            echo "CARGO_PACKAGER_SIGN_PRIVATE_KEY unset; updater .sig files will be missing"
          fi
          cargo packager --release --formats "${{ matrix.formats }}" \
            --target "${{ matrix.triple }}" "${extra[@]}"

      - name: Arch Linux package (Docker makepkg)
        if: ${{ contains(matrix.formats, 'pacman') }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: .github/scripts/build-arch-package.sh --version "$VERSION" --arch "${{ matrix.arch }}"

      # cargo-packager names mix amd64/arm64/x64; Ubuntu 22.04 and 24.04 .debs
      # would collide. Stamp every asset imprint_{ver}_{system}_{cpu}.*
      - name: Tag artifacts with OS and CPU
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DEB_TAG: ${{ matrix.deb_tag }}
        run: |
          set -euo pipefail
          extra=()
          if [[ -n "${DEB_TAG:-}" ]]; then
            extra+=(--deb-tag "$DEB_TAG")
          fi
          python3 .github/scripts/tag-release-assets.py \
            --version "$VERSION" \
            --arch "${{ matrix.arch }}" \
            "${extra[@]}"

      - name: Updater payload + latest.json fragment
        if: ${{ !matrix.skip_updater }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare-updater-assets.py \
            --arch "${{ matrix.arch }}" \
            "${{ needs.version.outputs.version }}"

      - name: Upload binaries to GitHub Release
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # gh release upload glob-expands each arg and errors on zero matches.
          # Only pass real files. Skip cargo-packager's per-arch PKGBUILD
          # (local source= filename, not AUR-ready). The aur job uploads
          # imprint-bin PKGBUILD + .SRCINFO instead.
          files=()
          for f in \
            dist/*.dmg \
            dist/*.msi \
            dist/*.exe \
            dist/*.deb \
            dist/*.AppImage \
            dist/*.tar.gz \
            dist/*.pkg.tar.zst \
            dist/*.pkg.tar.xz \
            dist/*.sig
          do
            [[ -f "$f" ]] || continue
            case "$(basename "$f")" in
              PKGBUILD | PKGBUILD.* | PKGBUILD.sig) continue ;;
            esac
            files+=("$f")
          done
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no package files in dist/" >&2
            ls -la dist/ >&2 || true
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
          printf 'uploaded to %s:\n' "$TAG"
          printf '  %s\n' "${files[@]}"

      - name: Merge and upload latest.json
        if: ${{ !matrix.skip_updater }}
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 .github/scripts/update-latest-json.py --version "$VERSION" --upload "$TAG"

  aur:
    name: AUR PKGBUILD
    needs: [version, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download pacman archives
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --dir dist \
            --pattern 'imprint_*_archlinux_x86_64.tar.gz' \
            --pattern 'imprint_*_archlinux_arm64.tar.gz'

      - name: Generate imprint-bin PKGBUILD
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 .github/scripts/prepare-aur-pkgbuild.py --version "$VERSION" --upload "$TAG"

  homebrew:
    name: Homebrew cask
    needs: [version, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS disk images
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Canonical names (tag-release-assets.py) plus cargo-packager fallbacks.
          for pattern in \
            'imprint_*_macos_arm64.dmg' \
            'imprint_*_macos_x86_64.dmg' \
            'Imprint_*_aarch64.dmg' \
            'Imprint_*_x64.dmg'
          do
            gh release download "$TAG" --dir dist --pattern "$pattern" || true
          done

      - name: Generate Homebrew cask
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 .github/scripts/prepare-homebrew-cask.py --version "$VERSION" --upload "$TAG"

      - name: Commit cask to default branch
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          cask="Casks/imprint.rb"
          test -f "$cask"
          generated="${RUNNER_TEMP}/imprint.rb"
          cp "$cask" "$generated"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          mkdir -p Casks
          cp "$generated" "$cask"
          if [[ -n "$(git status --porcelain -- "$cask")" ]]; then
            git add "$cask"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "homebrew: imprint ${VERSION}"
            git push origin "$BRANCH"
            echo "committed ${cask} to ${BRANCH}"
          else
            echo "cask already up to date on ${BRANCH}"
          fi
