[workspace]
resolver = "2"
members = [
  "crates/imprint-build",
  "crates/imprint-core",
  "crates/imprint-image",
  "crates/imprint-device",
  "crates/imprint-rpi",
  "crates/imprint-flash",
  "crates/imprint-ui",
  "crates/imprint-app",
  "crates/imprint-cli",
]
default-members = ["crates/imprint-app", "crates/imprint-cli"]

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98.0"
repository = "https://github.com/googolmo/imprint"
homepage = "https://github.com/googolmo/imprint"
authors = ["Imprint Contributors"]

[workspace.dependencies]
imprint-build = { path = "crates/imprint-build" }
imprint-core = { path = "crates/imprint-core" }
imprint-image = { path = "crates/imprint-image" }
imprint-device = { path = "crates/imprint-device" }
imprint-rpi = { path = "crates/imprint-rpi" }
imprint-flash = { path = "crates/imprint-flash" }
imprint-ui = { path = "crates/imprint-ui" }

# Official GPUI (Zed). Same git URL as gpui-component so Cargo unifies on one GPUI.
gpui = { git = "https://github.com/zed-industries/zed", version = "0.2.2" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

anyhow = "1.0.100"
thiserror = "2.0.16"
serde = "1.0.229"
serde_json = "1.0.151"
sys-locale = "0.3.2"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
clap = "4.6.6"
bytesize = "2.1.2"
sha2 = "0.10.9"
flate2 = "1.1.10"
bzip2 = "0.6.1"
liblzma = "0.4.5"
zstd = "0.14.0"
zip = "8.6.0"
indicatif = "0.18.0"
crossbeam-channel = "0.5.17"
libc = "0.2.189"
plist = "1.10.1"
cargo-packager-updater = "0.2.3"
ureq = "3.4.1"
sha-crypt = "0.5.0"
dirs = "7.0.0"
fatfs = "0.3.6"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
