name = "imprint"
product-name = "Imprint"
identifier = "imprint.cdxtheme.com"
version = "0.1.5"
description = "Flash OS images onto USB drives and SD cards"
long-description = "Pick an image, pick a removable disk, write, and optionally verify. Native desktop UI plus a CLI."
homepage = "https://github.com/googolmo/imprint"
authors = ["Imprint Contributors"]
license-file = "LICENSE"
category = "Utility"
out-dir = "./dist"
# Local `cargo packager` writes here. Release CI overrides with
# `cargo packager --out-dir dist/<pack_dir>` where pack_dir is
# `{system}[-{version}]-{arch}` (macos-arm64, ubuntu-24.04-amd64,
# windows-amd64, archlinux-arm64). Native CI runners still compile into
# `target/release`. `--target <triple>` is for package naming only; it does
# not send `cargo build --target`. Do not cross-compile into
# target/<triple>/release without updating binaries-dir to match.
binaries-dir = "./target/release"
before-packaging-command = "cargo build --release --locked -p imprint-app -p imprint-cli"
icons = [
  "assets/icon/AppIcon.icns",
  "assets/icon/AppIcon.ico",
  "assets/icon/AppIcon.png",
]
# Release packaging: `.github/workflows/release.yml` (native runners, both CPUs).
# Assets are renamed to imprint_{version}_{system}_{cpu}.* (cpu = amd64|arm64):
#   macOS   arm64 / amd64     → imprint_*_macos_{cpu}.dmg (+ .app.tar.gz updater)
#   Windows amd64             → imprint_*_windows_amd64.msi (WiX)
#   Windows arm64             → imprint_*_windows_arm64-setup.exe (NSIS)
#   Linux   arm64 / amd64     → imprint_*_ubuntu24.04_{cpu}.deb
#                               + imprint_*_ubuntu24.04_{cpu}.AppImage
#                               + imprint_*_archlinux_{cpu}.pkg.tar.zst (Arch Docker)
#   Linux   Ubuntu 26.04      → extra .deb per CPU (imprint_*_ubuntu26.04_{cpu}.deb)
#   Homebrew: `.github/scripts/prepare-homebrew-cask.py` writes Casks/imprint.rb;
#             tag pushes update googolmo/homebrew-tap (brew tap googolmo/tap)
#   Linux repo: tag pushes dispatch googolmo/repo `update-index` (APT Packages,
#               Cloudflare .deb redirects, pacman/repo.conf; packages stay here)
# Updater manifest: `.github/scripts/update-latest-json.py --upload <tag>` merges into the release.
# Env vars used at build/package time (full list is in that workflow's header):
#   CARGO_PACKAGER_UPDATER_PUBKEY / CARGO_PACKAGER_UPDATER_ENDPOINT (comma-separated URLs ok)
#   CARGO_PACKAGER_SIGN_PRIVATE_KEY / CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#   (CI prepends .github/scripts/codesign so imprint-cli is signed before imprint)
#   APPLE_API_KEY / APPLE_API_ISSUER / APPLE_API_KEY_CONTENT
#   WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD
#   WINDOWS_CERTIFICATE_THUMBPRINT / WINDOWS_TIMESTAMP_URL
#   (CI locates signtool.exe — cargo-packager's registry lookup is x86/x64-only)
formats = ["app", "dmg", "wix", "nsis", "deb", "appimage", "pacman"]

# Depends work on Ubuntu 24.04+ and Debian 13+ (`libasound2t64` is Ubuntu 24.04+).
# Release.yml also uploads Ubuntu 26.04 .debs per CPU (newer glibc).
[deb]
package-name = "imprint"
section = "utils"
depends = [
  "libxkbcommon0",
  "libxkbcommon-x11-0",
  "libwayland-client0",
  "libfontconfig1",
  "libfreetype6",
  "libx11-6",
  "libasound2 | libasound2t64",
  "libvulkan1",
  "libgl1",
]

[pacman]
depends = [
  "alsa-lib",
  "fontconfig",
  "freetype2",
  "libx11",
  "libxkbcommon",
  "libxkbcommon-x11",
  "mesa",
  "vulkan-icd-loader",
  "wayland",
]
provides = ["imprint"]
conflicts = ["imprint"]

[[binaries]]
path = "imprint"
main = true

[[binaries]]
path = "imprint-cli"
